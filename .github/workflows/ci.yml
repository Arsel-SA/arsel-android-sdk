name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Android Lint is the cross-version check. The unit tests run against the mockable
  # android.jar, which has no notion of API levels, so nothing there can catch a
  # framework call that is missing its `Build.VERSION` guard — `NewApi` can, statically,
  # across the whole minSdk 23 → SDK 35 range and without an emulator.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint + Android Lint
        run: ./gradlew ktlintCheck lintRelease

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug test

      # The sample is a separate Gradle build that resolves the SDK from
      # mavenLocal, exactly as an integrator resolves it from Maven Central —
      # so it has to be published before it can be built.
      - name: Publish the SDK to mavenLocal
        run: ./gradlew publishToMavenLocal

      - name: Point the sample at the runner's SDK
        run: echo "sdk.dir=$ANDROID_HOME" > sample/local.properties

      # Fake ids: the google-services plugin validates structure, not authenticity.
      - name: Install the CI Firebase config
        run: cp sample/ci/google-services.ci.json sample/app/google-services.json

      - name: Check the sample pins the version being built
        run: |
          sdk=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          pin=$(sed -n 's/^arselPush = "\(.*\)"/\1/p' sample/gradle/libs.versions.toml)
          [ "$sdk" = "$pin" ] || { echo "sample pins $pin but the SDK is $sdk"; exit 1; }

      - name: Build the sample
        run: cd sample && ./gradlew :app:assembleStagingDebug

  # Unit tests never run R8 or WorkManager. This installs the sample shrunk exactly like a store
  # build, on current AGP, and fails unless the SDK's drain worker actually runs.
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Publish the SDK and build the shrunk sample
        run: |
          ./gradlew publishToMavenLocal
          echo "sdk.dir=$ANDROID_HOME" > sample/local.properties
          cp sample/ci/google-services.ci.json sample/app/google-services.json
          cd sample && ./gradlew :app:assembleCiRelease

      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sample/ci/release-smoke.sh
