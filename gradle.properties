org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Published coordinates. Maven Central groupId must be a domain you own/verify —
# sa.arsel is the reverse-DNS of arsel.sa, and the code package matches it.
# VERSION_NAME is the single source of truth for the SDK version (see RELEASING.md).
GROUP=sa.arsel
VERSION_NAME=1.4.0

# Shared POM for both modules (per-module name/description/artifactId live in each
# module's gradle.properties). Read by the com.vanniktech.maven.publish plugin.
POM_URL=https://github.com/BasicsEngage/arsel-android-sdk
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://github.com/BasicsEngage/arsel-android-sdk/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=BasicsEngage
POM_DEVELOPER_NAME=Arsel
POM_DEVELOPER_URL=https://github.com/BasicsEngage
POM_SCM_URL=https://github.com/BasicsEngage/arsel-android-sdk
POM_SCM_CONNECTION=scm:git:git://github.com/BasicsEngage/arsel-android-sdk.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/BasicsEngage/arsel-android-sdk.git
